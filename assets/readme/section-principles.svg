<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">How every number in this repository is produced</title>
  <desc id="desc">Four stages left to right: one rig — both tools on one machine in the same hour; full scripts — every task is a committed script at tasks/&lt;tool&gt;/&lt;task&gt;.sh; captured run — no run, no number; no invented numbers — limits stated, every time.</desc>

  <rect width="1200" height="140" rx="20" fill="#0B0E14"/>

  <g id="stages" transform="translate(56 0)">
    <g id="stage-rig" transform="translate(0 0)">
      <g stroke="#8B949E" stroke-width="2" fill="none">
        <rect x="0" y="30" width="26" height="17" rx="3"/>
        <line x1="13" y1="47" x2="13" y2="52"/>
        <line x1="8" y1="52" x2="18" y2="52"/>
      </g>
      <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E6EDF3">SAME RIG</text>
      <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">one machine, same hour</text>
    </g>

    <g id="stage-script" transform="translate(281 0)">
      <g stroke="#8B949E" stroke-width="2" fill="none">
        <path d="M2 30 H16 L24 38 V56 H2 Z"/>
        <path d="M16 30 V38 H24"/>
      </g>
      <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E6EDF3">FULL SCRIPTS</text>
      <text x="0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">tasks/&lt;tool&gt;/&lt;task&gt;.sh</text>
    </g>

    <g id="stage-run" transform="translate(562 0)">
      <g stroke="#8B949E" stroke-width="2" fill="none">
        <rect x="0" y="30" width="26" height="26" rx="3"/>
        <path d="M6 38 l4 4 -4 4"/>
        <line x1="15" y1="46" x2="21" y2="46"/>
      </g>
      <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E6EDF3">CAPTURED RUN</text>
      <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">no run, no number</text>
    </g>

    <g id="stage-number" transform="translate(843 0)">
      <g fill="#8B949E">
        <rect x="0" y="44" width="7" height="12" rx="2"/>
        <rect x="11" y="34" width="7" height="22" rx="2"/>
        <rect x="22" y="40" width="7" height="16" rx="2"/>
      </g>
      <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E6EDF3">NO INVENTED NUMBERS</text>
      <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">limits stated, every time</text>
    </g>
  </g>

  <g id="flow" stroke="#8B949E" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <line x1="311" y1="43" x2="326" y2="43"/>
    <line x1="592" y1="43" x2="607" y2="43"/>
    <line x1="873" y1="43" x2="888" y2="43"/>
  </g>
  <g fill="#8B949E" fill-opacity="0.55">
    <path d="M325 38 L332 43 L325 48 Z"/>
    <path d="M606 38 L613 43 L606 48 Z"/>
    <path d="M887 38 L894 43 L887 48 Z"/>
  </g>
</svg>
