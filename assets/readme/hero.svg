<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">agent-tool-benchmark — same-machine, rerunnable benchmarks of AI agent tools</title>
  <desc id="desc">Wall-clock time and correctness for AI agent tools, measured on one machine per comparison with committed task scripts. Every number is reproduced by the suite's committed runner (run.py, or tasks/&lt;tool&gt;/&lt;task&gt;.sh for the browser suite). Shown: the TodoMVC interaction task on an Apple M5 Max, browser-use CLI 9.1 seconds versus ego lite 1.3 seconds. Five suites, six comparisons, one still pending because its run needs API keys.</desc>

  <rect width="1200" height="380" rx="26" fill="#0B0E14"/>

  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3" fill="#8B949E">SAME MACHINE · SAME TASKS · SAME HOUR</text>
    <text x="0" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="48" font-weight="700" fill="#E6EDF3">agent-tool-benchmark</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#8B949E">Wall-clock time and correctness for AI agent tools.</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#8B949E">Every number comes from a committed script.</text>

    <rect x="0" y="244" width="400" height="46" rx="10" fill="#11161F" stroke="#232C3A" stroke-width="1.5"/>
    <text x="24" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8B949E">$</text>
    <text x="48" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#3FB950">python run.py · tasks/*.sh</text>

    <text x="0" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">5 suites · 6 comparisons · 1 pending (search: awaiting API keys)</text>
  </g>

  <!-- proof: one rig, both tools timed on the same task suite -->
  <g id="rig-proof" transform="translate(672 84)">
    <rect x="0" y="0" width="472" height="252" rx="16" fill="#11161F" stroke="#232C3A" stroke-width="1.5"/>

    <!-- the machine both runs happened on -->
    <rect x="24" y="20" width="424" height="42" rx="9" fill="#0B0E14" stroke="#232C3A" stroke-width="1.5"/>
    <g transform="translate(40 30)" stroke="#8B949E" stroke-width="2" fill="none">
      <rect x="0" y="0" width="26" height="17" rx="3"/>
      <line x1="13" y1="17" x2="13" y2="22"/>
      <line x1="8" y1="22" x2="18" y2="22"/>
    </g>
    <text x="76" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EDF3">Apple M5 Max · macOS 26.5</text>
    <text x="448" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">2026-07-28</text>

    <text x="24" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">TodoMVC · add 3, toggle 1, read the count</text>

    <line x1="188" y1="114" x2="188" y2="198" stroke="#232C3A" stroke-width="1.5"/>

    <rect x="24" y="108" width="424" height="44" rx="9" fill="#0B0E14" stroke="#232C3A" stroke-width="1.5"/>
    <text x="44" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">browser-use CLI</text>
    <rect x="188" y="119" width="176" height="22" rx="5" fill="#58A6FF"/>
    <text x="424" y="135" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#58A6FF">9.1 s</text>

    <rect x="24" y="160" width="424" height="44" rx="9" fill="#0B0E14" stroke="#232C3A" stroke-width="1.5"/>
    <text x="44" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">ego lite</text>
    <rect x="188" y="171" width="25" height="22" rx="5" fill="#3FB950"/>
    <text x="424" y="187" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#3FB950">1.3 s</text>

    <text x="24" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B949E">wall clock · single run · script committed</text>
  </g>
</svg>
