<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Wall-clock timings</title>
  <desc id="desc">Grouped bar chart of measured wall times: Hacker News scrape 6.4 seconds for browser-use versus 9.7 for ego lite; TodoMVC interaction 9.1 versus 1.3; two parallel tasks not supported locally by browser-use versus 2.4 seconds total on ego lite.</desc>

  <rect width="1200" height="480" rx="26" fill="#0B0E14"/>

  <text x="56" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#E6EDF3">Wall-clock time per task</text>
  <text x="1144" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">seconds · lower is better</text>

  <!-- legend -->
  <g transform="translate(56 92)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#58A6FF"/>
    <text x="26" y="15" fill="#8B949E">browser-use CLI 0.1.8</text>
    <rect x="260" y="0" width="18" height="18" rx="4" fill="#3FB950"/>
    <text x="286" y="15" fill="#8B949E">ego lite 0.4.5.5</text>
  </g>

  <!-- grid: x from 340 to 1120, 0..10s, 78 units per second -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B949E">
    <g stroke="#1C2430" stroke-width="1.5">
      <line x1="340" y1="136" x2="340" y2="400"/>
      <line x1="496" y1="136" x2="496" y2="400"/>
      <line x1="652" y1="136" x2="652" y2="400"/>
      <line x1="808" y1="136" x2="808" y2="400"/>
      <line x1="964" y1="136" x2="964" y2="400"/>
      <line x1="1120" y1="136" x2="1120" y2="400"/>
    </g>
    <text x="340" y="424" text-anchor="middle">0</text>
    <text x="496" y="424" text-anchor="middle">2</text>
    <text x="652" y="424" text-anchor="middle">4</text>
    <text x="808" y="424" text-anchor="middle">6</text>
    <text x="964" y="424" text-anchor="middle">8</text>
    <text x="1120" y="424" text-anchor="middle">10</text>
  </g>

  <!-- Task 1: HN scrape — bu 6.4 (499), ego 9.7 (757) -->
  <g transform="translate(0 150)">
    <text x="316" y="30" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E6EDF3">Hacker News scrape</text>
    <rect x="340" y="0" width="499" height="24" rx="5" fill="#58A6FF"/>
    <text x="847" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#58A6FF">6.4</text>
    <rect x="340" y="30" width="757" height="24" rx="5" fill="#3FB950"/>
    <text x="1105" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#3FB950">9.7</text>
  </g>

  <!-- Task 2: TodoMVC — bu 9.1 (710), ego 1.3 (101) -->
  <g transform="translate(0 240)">
    <text x="316" y="30" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E6EDF3">TodoMVC interaction</text>
    <rect x="340" y="0" width="710" height="24" rx="5" fill="#58A6FF"/>
    <text x="1058" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#58A6FF">9.1</text>
    <rect x="340" y="30" width="101" height="24" rx="5" fill="#3FB950"/>
    <text x="449" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#3FB950">1.3</text>
  </g>

  <!-- Task 5: parallel — bu n/a, ego 2.4 (187) -->
  <g transform="translate(0 330)">
    <text x="316" y="30" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E6EDF3">Two tasks in parallel</text>
    <rect x="340" y="0" width="380" height="24" rx="5" fill="#1C2430"/>
    <text x="352" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B949E">not supported locally (shares your Chrome tabs)</text>
    <rect x="340" y="30" width="187" height="24" rx="5" fill="#3FB950"/>
    <text x="535" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#3FB950">2.4 total</text>
  </g>

  <text x="56" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#8B949E">Single run per task, includes CLI startup. ego lite Hacker News time includes one-time task-space creation. Apple M5 Max, macOS 26.5, 2026-07-28.</text>
</svg>
